<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammed Ansheed | Michelin-Trained Demi Chef de Partie</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <style>
        :root {
            --gold: #D4AF37;
            --gold-light: #F4E4BC;
            --dark: #0a0a0a;
            --red: #E63946;
            --orange: #F4A261;
            --cream: #FFF8E7;
            --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --gradient-3: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --gradient-gold: linear-gradient(135deg, #D4AF37 0%, #FFD700 50%, #B8860B 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--dark);
            color: white;
            overflow-x: hidden;
        }

        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
        }

        /* Particle Background */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--gold);
            border-radius: 50%;
            opacity: 0.6;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-100vh) translateX(100px); }
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--gold);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 900;
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            position: relative;
        }

        .nav-links a:hover {
            color: var(--gold);
            transform: translateY(-2px);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--gold);
            transition: width 0.3s;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a0a 100%);
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, var(--gold), transparent 30%);
            animation: rotate 10s linear infinite;
            opacity: 0.1;
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        .hero-content {
            z-index: 10;
            position: relative;
        }

        .hero h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 900;
            margin-bottom: 20px;
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        .hero .subtitle {
            font-size: 1.5rem;
            color: var(--gold-light);
            margin-bottom: 10px;
            font-weight: 300;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .hero .tagline {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 40px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .cta-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 40px;
            border: none;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: var(--gradient-gold);
            color: var(--dark);
            border-radius: 50px;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 40px rgba(212, 175, 55, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: var(--gold);
            border: 2px solid var(--gold);
            border-radius: 50px;
        }

        .btn-secondary:hover {
            background: var(--gold);
            color: var(--dark);
            transform: scale(1.05);
        }

        .michelin-badge {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 30px;
            background: rgba(212, 175, 55, 0.2);
            border: 1px solid var(--gold);
            border-radius: 50px;
            font-size: 0.9rem;
            color: var(--gold);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); }
            50% { box-shadow: 0 0 0 20px rgba(212, 175, 55, 0); }
        }

        /* Section Styles */
        section {
            padding: 100px 50px;
            position: relative;
            z-index: 10;
        }

        .section-title {
            font-size: clamp(2rem, 5vw, 3.5rem);
            text-align: center;
            margin-bottom: 60px;
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 100px;
            height: 4px;
            background: var(--gradient-gold);
            margin: 20px auto;
            border-radius: 2px;
        }

        /* About Section */
        .about {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .about-image {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(212, 175, 55, 0.3);
        }

        .about-image img {
            width: 100%;
            height: 500px;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .about-image:hover img {
            transform: scale(1.1);
        }

        .about-text h3 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: var(--gold);
        }

        .about-text p {
            line-height: 1.8;
            color: #ccc;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-top: 40px;
        }

        .stat-item {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            transition: all 0.3s;
        }

        .stat-item:hover {
            transform: translateY(-10px);
            background: rgba(212, 175, 55, 0.1);
            border-color: var(--gold);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--gold);
            display: block;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 5px;
        }

        /* Timeline / Experience */
        .experience {
            background: var(--dark);
        }

        .timeline {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: var(--gradient-gold);
            border-radius: 2px;
        }

        .timeline-item {
            display: flex;
            justify-content: flex-end;
            padding-right: 30px;
            position: relative;
            margin-bottom: 80px;
            width: 50%;
        }

        .timeline-item:nth-child(even) {
            justify-content: flex-start;
            padding-right: 0;
            padding-left: 30px;
            margin-left: 50%;
        }

        .timeline-content {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), rgba(102, 126, 234, 0.1));
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            max-width: 400px;
            position: relative;
            transition: all 0.3s;
        }

        .timeline-content:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 40px rgba(212, 175, 55, 0.2);
            border-color: var(--gold);
        }

        .timeline-content::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: var(--gold);
            border-radius: 50%;
            top: 30px;
        }

        .timeline-item:nth-child(odd) .timeline-content::before {
            right: -40px;
        }

        .timeline-item:nth-child(even) .timeline-content::before {
            left: -40px;
        }

        .timeline-date {
            color: var(--gold);
            font-weight: 700;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .timeline-title {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: white;
        }

        .timeline-company {
            color: var(--orange);
            font-weight: 600;
            margin-bottom: 15px;
        }

        .timeline-desc {
            color: #aaa;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .timeline-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 2px solid var(--gold);
        }

        /* Special Feature: Sand & Koal & Chef Jack */
        .featured-section {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            position: relative;
            overflow: hidden;
        }

        .featured-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,215,0,0.1)" stroke-width="0.5"/></svg>');
            background-size: 100px 100px;
            opacity: 0.3;
        }

        .featured-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            max-width: 1200px;
            margin: 0 auto;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .featured-image {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
        }

        .featured-image img {
            width: 100%;
            height: 500px;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .featured-image:hover img {
            transform: scale(1.1);
        }

        .featured-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--gradient-gold);
            color: var(--dark);
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.9rem;
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4);
        }

        .featured-content h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: var(--gold);
        }

        .featured-content h3 {
            font-size: 1.5rem;
            color: var(--orange);
            margin-bottom: 20px;
        }

        .featured-content p {
            line-height: 1.8;
            color: #ddd;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .chef-highlight {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 15px;
            border-left: 4px solid var(--gold);
            margin-top: 30px;
        }

        .chef-highlight h4 {
            color: var(--gold);
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .chef-highlight p {
            color: #ccc;
            font-size: 1rem;
        }

        /* Skills Section */
        .skills {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .skill-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .skill-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.1), transparent);
            transition: left 0.5s;
        }

        .skill-card:hover::before {
            left: 100%;
        }

        .skill-card:hover {
            transform: translateY(-10px);
            border-color: var(--gold);
            box-shadow: 0 20px 60px rgba(212, 175, 55, 0.2);
        }

        .skill-icon {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .skill-card h3 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: var(--gold);
        }

        .skill-card p {
            color: #aaa;
            line-height: 1.6;
        }

        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }

        .tag {
            background: rgba(212, 175, 55, 0.2);
            color: var(--gold);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* Gallery Section */
        .gallery {
            background: var(--dark);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-item {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            height: 300px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .gallery-item:hover {
            border-color: var(--gold);
            transform: scale(1.05);
            z-index: 10;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .gallery-item:hover img {
            transform: scale(1.2);
        }

        .gallery-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            padding: 20px;
            transform: translateY(100%);
            transition: transform 0.3s;
        }

        .gallery-item:hover .gallery-overlay {
            transform: translateY(0);
        }

        .gallery-overlay h4 {
            color: var(--gold);
            font-size: 1.1rem;
        }

        .gallery-overlay p {
            color: #aaa;
            font-size: 0.9rem;
        }

        /* Achievements */
        .achievements {
            background: linear-gradient(135deg, #232526 0%, #414345 100%);
        }

        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .achievement-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 30px;
            display: flex;
            gap: 20px;
            align-items: start;
            transition: all 0.3s;
        }

        .achievement-card:hover {
            transform: translateX(10px);
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.1);
        }

        .achievement-icon {
            font-size: 2.5rem;
            flex-shrink: 0;
        }

        .achievement-content h3 {
            color: var(--gold);
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .achievement-content p {
            color: #aaa;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        /* Contact Section */
        .contact {
            background: linear-gradient(135deg, #000000 0%, #434343 100%);
            text-align: center;
        }

        .contact-info {
            display: flex;
            justify-content: center;
            gap: 50px;
            flex-wrap: wrap;
            margin-top: 40px;
        }

        .contact-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .contact-item .icon {
            font-size: 2rem;
            color: var(--gold);
        }

        .contact-item a {
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            transition: color 0.3s;
        }

        .contact-item a:hover {
            color: var(--gold);
        }

        .social-links {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
        }

        .social-links a {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-size: 1.3rem;
            transition: all 0.3s;
            border: 1px solid var(--gold);
        }

        .social-links a:hover {
            background: var(--gold);
            color: var(--dark);
            transform: translateY(-5px);
        }

        /* Footer */
        footer {
            background: #000;
            padding: 30px;
            text-align: center;
            border-top: 2px solid var(--gold);
            position: relative;
            z-index: 10;
        }

        footer p {
            color: #666;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .about-grid,
            .featured-grid {
                grid-template-columns: 1fr;
            }
            
            .timeline::before {
                left: 20px;
            }
            
            .timeline-item,
            .timeline-item:nth-child(even) {
                width: 100%;
                margin-left: 0;
                padding-left: 50px;
                padding-right: 0;
                justify-content: flex-start;
            }
            
            .timeline-item:nth-child(odd) .timeline-content::before,
            .timeline-item:nth-child(even) .timeline-content::before {
                left: -35px;
            }
            
            nav {
                padding: 15px 20px;
            }
            
            .nav-links {
                display: none;
            }
            
            section {
                padding: 60px 20px;
            }
        }

        /* Scroll animations */
        .reveal {
            opacity: 0;
            transform: translateY(50px);
            transition: all 0.8s;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--gold-light);
        }

        /* Chef Colleagues Panel */
        .chef-colleagues {
            margin-top: 20px;
        }
        .chef-layer {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            justify-content: center;
        }
        .chef-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--gold);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .chef-avatar:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
        }
        .chef-label {
            font-size: 0.7rem;
            color: var(--gold-light);
            text-align: center;
            margin-top: 5px;
            letter-spacing: 1px;
        }
        .chef-single-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--gold);
            margin-top: 15px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .chef-single-img:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
        }
    </style>
<base target="_blank">
